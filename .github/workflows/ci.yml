name: ci

# One run per commit: a branch is tested by its pull request, main by its push (which the release
# workflow waits on). A newer push to the same branch cancels the run still going.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m coverage run -m pytest -n auto
      # The processes the scenarios and hooks start are measured into files of their own.
      - run: python -m coverage combine
      - run: python -m coverage report

  all-on:
    # Every adaptive setting on, as a person gets them, with a fake `claude`: where features meet.
    # The unit tests turn each one on alone; this is the profile real use runs in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -n auto
        env:
          LOCKS_TEST_ALL_ON: "1"

  plugin:
    # The plugin as Claude Code loads it: its manifest, its commands and the mod's own tests,
    # which the Python suite never runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin test .
