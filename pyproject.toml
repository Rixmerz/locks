[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locks"
version = "0.82.0"
description = "One core for Claude Code: route each task to the right model, effort and capabilities, escalate on evidence, and remember what failed across repositories"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# The core is standard library only. A hook runs on every prompt, and a
# dependency that fails to import there is a session that fails to start.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "coverage>=7"]

[project.scripts]
locks = "locks.cli:main"
cauce = "locks.cli:main"  # legacy-name: the old command keeps working

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"locks" = ["workflow_templates/*.json", "guides/*.md", "roles/*.md", "roles/CREDITS.txt", "roles_internal/*.md", "skills/*/*", "skills/*.md", "skills/LICENSE*"]
"locks.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.coverage.run]
source = ["locks"]
branch = true
# The scenarios and the hooks run locks as real processes (`bin/locks`, `python -m locks`):
# measured too, so the fast path and the dispatcher count.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
fail_under = 99
show_missing = true
